        file: ${{ "install_pkg.bat" if build_platform in ["win-64", "win-arm64"] else "install_pkg.sh" }}
    requirements:
      host:
        - m2-gcc-libs
        - m2-libzstd
        - m2-msys2-runtime
        - m2-conda-epoch =20261029
      run:
        - m2-gcc-libs
